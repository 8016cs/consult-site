<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简咨询预约（验证版）</title>
  <style>
    :root { --brand: #2563eb; --bg: #f6f8fb; --card: #fff; --text: #1f2933; --muted: #667085; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
    header h1 { font-size: 24px; margin: 0 0 8px; }
    header p { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
    label { display: block; font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0d7e2; border-radius: 8px; font-size: 14px; font-family: inherit; }
    textarea { min-height: 80px; resize: vertical; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: var(--brand); color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .tip { font-size: 12px; color: var(--muted); margin-top: 6px; }
    #msg { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
    .ok { background: #e7f6ec; color: #1a7f37; }
    .err { background: #fdeaea; color: #b42318; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>咨询服务预约（验证版）</h1>
      <p>这是一个用于验证「网站 → 表单 → Cloudflare Worker → 钉钉」链路的最小页面。</p>
    </header>

    <div class="card">
      <form id="applyForm">
        <label for="name">你的称呼 *</label>
        <input id="name" name="name" type="text" placeholder="如：张三" required>

        <label for="contact">联系方式（微信/手机） *</label>
        <input id="contact" name="contact" type="text" placeholder="如：微信号 xxx" required>

        <label for="demand">想咨询什么？</label>
        <textarea id="demand" name="demand" placeholder="简单描述你的需求"></textarea>

        <label for="budget">预算范围（选填）</label>
        <input id="budget" name="budget" type="text" placeholder="如：500-1000 元">

        <button id="submitBtn" type="submit">提交申请</button>
        <p class="tip">提交后信息会自动推送到钉钉，我会尽快联系你。</p>
      </form>
      <div id="msg"></div>
    </div>

    <footer>极简验证版 · 由 Cloudflare Pages + Workers 驱动</footer>
  </div>

  <script>
    // ★★★ 部署后把这里换成你自己的 Worker 地址 ★★★
    const API_ENDPOINT = "https://consult-apply.YOUR_ACCOUNT.workers.dev";

    const form = document.getElementById("applyForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    function show(text, type) {
      msg.textContent = text;
      msg.className = type === "ok" ? "ok" : "err";
      msg.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "提交中...";
      try {
        const payload = {
          name: form.name.value.trim(),
          contact: form.contact.value.trim(),
          demand: form.demand.value.trim(),
          budget: form.budget.value.trim()
        };
        const res = await fetch(API_ENDPOINT + "/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          show("提交成功！我会尽快通过你留下的联系方式联系你。", "ok");
          form.reset();
        } else {
          show("提交失败：" + (data.error || res.status) + "，请稍后重试。", "err");
        }
      } catch (err) {
        show("网络错误，请检查 Worker 地址配置或稍后重试。", "err");
      } finally {
        btn.disabled = false;
        btn.textContent = "提交申请";
      }
    });
  </script>
</body>
</html>
